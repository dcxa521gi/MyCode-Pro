plugins { id 'com.android.application' }
android {
 namespace 'com.mycode.mobile'
 compileSdk 35
 defaultConfig { applicationId 'com.mycode.mobile'; minSdk 26; targetSdk 35; versionCode 180; versionName '0.18.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all { testLogging { events 'failed'; exceptionFormat 'full' } }
 }
 def signingFile = System.getenv('MYCODE_ANDROID_KEYSTORE_FILE')
 if (signingFile) {
  signingConfigs {
   release {
    storeFile file(signingFile)
    storePassword System.getenv('MYCODE_ANDROID_STORE_PASSWORD')
    keyAlias 'mycode'
    keyPassword System.getenv('MYCODE_ANDROID_STORE_PASSWORD')
   }
  }
  buildTypes { release { signingConfig signingConfigs.release } }
 }
}
dependencies {
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 // ZXing 4.3.0's published POM omits its implementation dependencies.
 implementation 'androidx.fragment:fragment:1.3.6'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
