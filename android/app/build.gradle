plugins { id 'com.android.application' }
android {
 namespace 'com.mycode.mobile'
 compileSdk 35
 defaultConfig { applicationId 'com.mycode.mobile'; minSdk 26; targetSdk 35; versionCode 170; versionName '0.17.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 testOptions { unitTests.includeAndroidResources = true }
 def signingFile = System.getenv('MYCODE_ANDROID_KEYSTORE_FILE')
 if (signingFile) {
  signingConfigs {
   release {
    storeFile file(signingFile)
    storePassword System.getenv('MYCODE_ANDROID_STORE_PASSWORD')
    keyAlias 'mycode'
    keyPassword System.getenv('MYCODE_ANDROID_STORE_PASSWORD')
   }
  }
  buildTypes { release { signingConfig signingConfigs.release } }
 }
}
dependencies {
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
