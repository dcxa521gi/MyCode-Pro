<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>MyCode</title><style>
:root{color-scheme:light dark;--bg:#f5f6f7;--panel:#fff;--fg:#20272b;--sub:#6d787e;--line:#dce1e4;--hover:#edf0f2;--accent:#3b7882}@media(prefers-color-scheme:dark){:root{--bg:#14252b;--panel:#1d333b;--fg:#d8e6eb;--sub:#8da6b0;--line:#35505a;--hover:#29434d;--accent:#79bac3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}header strong{font-size:18px;flex:1}button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}button:active{background:var(--hover)}button:disabled{opacity:.4}input,textarea,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;width:100%}textarea{resize:vertical}main{padding:16px;max-width:880px;margin:auto}h2{font-size:18px;margin:0 0 12px}p{line-height:1.6}.sub{color:var(--sub);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.status{font-size:12px;color:var(--sub);padding:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.session{width:100%;text-align:left;border:0;background:transparent;padding:12px 0;border-bottom:1px solid var(--line)}.session:last-child{border:0}.session strong{display:block}.session small{display:block;margin-top:5px;color:var(--sub);word-break:break-all}.message{padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.message.user{background:var(--hover);border-radius:14px;padding:14px;margin:14px 0}.message label{display:block;color:var(--sub);font-size:11px;margin-bottom:6px}#composer{position:sticky;bottom:0;padding:12px;background:var(--bg);border-top:1px solid var(--line);margin:0 -16px -16px}#composer textarea{min-height:70px;max-height:200px}#composer .row{margin-top:8px}#activity{font-size:12px;line-height:1.6;color:var(--sub);white-space:pre-wrap}#plan li{padding:7px 0;list-style:none}#plan ol{padding:0;margin:0}.done{color:var(--sub);text-decoration:line-through}#chatTitle{overflow-wrap:anywhere}.question label{display:block;padding:6px 0}.question input{width:auto}#language{width:auto;font-size:12px;padding:7px}#notice{position:sticky;top:68px;background:var(--bg);z-index:1}footer{padding:20px 0;color:var(--sub);font-size:11px;text-align:center}[hidden]{display:none!important}
</style></head><body><header><button id="back" hidden onclick="back()">‹</button><strong>MyCode</strong><select id="language" aria-label="Language" onchange="language=this.value;renderLabels();refresh()"><option value="zh-CN">中文</option><option value="en">English</option></select><button id="disconnect" hidden onclick="disconnect()">断开</button></header><main><div id="notice" role="status" class="status"></div><section id="pairView"><div class="card"><h2 data-zh="连接电脑上的 MyCode" data-en="Connect to desktop MyCode"></h2><p class="sub" data-zh="在电脑打开 设置 → 手机连接，开启连接并扫码。手机与电脑需在同一可信网络或 VPN 中，任务在电脑执行。" data-en="Enable Settings → Mobile connection on your computer. Use a trusted local network or VPN. CLI tasks run on the computer."></p><div class="row"><button onclick="Desktop.scan()" data-zh="扫描配对二维码" data-en="Scan pairing QR"></button><button onclick="Desktop.paste()" data-zh="粘贴配对信息" data-en="Paste pairing code"></button></div><textarea id="pairText" rows="4" style="margin:12px 0" aria-label="Pairing information" placeholder="配对信息 / Pairing information"></textarea><button id="pairButton" onclick="pair()" data-zh="配对连接" data-en="Pair and connect"></button><p class="sub" data-zh="配对码仅可使用一次，10 分钟内有效。连接使用 TLS 与证书固定校验。模型密钥留在电脑，设备授权加密保存在手机中。" data-en="Pairing is single-use and expires in 10 minutes. TLS and certificate pinning protect the connection. Model keys remain on the computer; device authorization is encrypted on this phone."></p></div></section><section id="listView" hidden><div class="row" style="align-items:center;margin-bottom:16px"><h2 style="flex:1;margin:0" data-zh="项目与会话" data-en="Projects and sessions"></h2><button onclick="refresh()" data-zh="刷新" data-en="Refresh"></button></div><input id="search" aria-label="Search sessions" placeholder="搜索会话 / Search sessions" oninput="renderSessions()"><div id="sessions" style="margin-top:12px"></div></section><section id="chatView" hidden><h2 id="chatTitle"></h2><div id="chatInfo" class="sub"></div><div id="plan" class="card" hidden></div><div id="activity" class="card" hidden></div><div id="approvals"></div><div id="questions"></div><div id="messages"></div><div id="composer"><textarea id="draft" aria-label="Message" placeholder="输入下一步想法 / Next instruction"></textarea><div class="row"><button id="stop" onclick="act('stop')" data-zh="暂停任务" data-en="Pause task"></button><button id="send" onclick="send()" data-zh="发送" data-en="Send"></button></div><p class="sub" data-zh="沿用当前会话的项目、代理和模型；电脑上的权限规则仍然生效。" data-en="Uses this session's project, agent and model. Desktop permission rules still apply."></p></div></section><footer data-zh="本地控制端 · 不使用 Cindy 云服务" data-en="Local controller · No Cindy cloud services"></footer></main><script>
let language='zh-CN',sessions=[],current=null,sessionId='',timer=null,inFlight=false,pending={},sequence=0,drafts={},lastQuestionSignature='';const $=id=>document.getElementById(id),t=(zh,en)=>language==='zh-CN'?zh:en;
function renderLabels(){document.documentElement.lang=language;document.querySelectorAll('[data-zh]').forEach(el=>el.textContent=el.dataset[language==='zh-CN'?'zh':'en']);$('disconnect').textContent=t('断开','Disconnect');}
function notice(text){$('notice').textContent=text;}
function api(input,pair=false){return new Promise((resolve,reject)=>{const id=String(++sequence),timeout=setTimeout(()=>{delete pending[id];reject(Error(t('电脑连接超时，请检查网络及桌面状态。','Desktop timed out. Check network and desktop.')))},35000);pending[id]={resolve,reject,timeout};if(pair)Desktop.pair(id,input);else Desktop.request(id,JSON.stringify(input));});}
window.onNative=(id,result)=>{if(id==='pairing'){$('pairText').value=result.pairing;return;}if(id==='boot'){connected();return;}if(id==='disconnect'){pauseRefresh();sessionId='';sessions=[];current=null;drafts={};$('messages').replaceChildren();$('pairView').hidden=false;$('listView').hidden=true;$('chatView').hidden=true;$('disconnect').hidden=true;$('back').hidden=true;notice(t('已断开手机连接。电脑任务继续运行。','Phone disconnected. Desktop tasks keep running.'));return;}const item=pending[id];if(!item)return;clearTimeout(item.timeout);delete pending[id];result.error?item.reject(Error(result.error)):item.resolve(result);};
async function pair(){$('pairButton').disabled=true;try{await api($('pairText').value,true);$('pairText').value='';connected();}catch(e){notice(e.message);}finally{$('pairButton').disabled=false;}}
function connected(){$('pairView').hidden=true;$('listView').hidden=false;$('disconnect').hidden=false;notice(t('已连接，正在读取电脑会话…','Connected. Loading desktop sessions…'));refresh();}
function disconnect(){Desktop.disconnect();}
function pauseRefresh(){clearTimeout(timer);timer=null;}
async function refresh(){pauseRefresh();if($('pairView').hidden===false||inFlight)return;inFlight=true;try{if(sessionId){const id=sessionId;const result=await api({action:'session',sessionId:id});if(id===sessionId)renderChat(result);}else{const result=await api({action:'snapshot'});sessions=result.sessions||[];renderSessions();}notice('');}catch(e){notice(e.message);}finally{inFlight=false;timer=setTimeout(refresh,sessionId&&current?.busy?2000:5000);}}
function renderSessions(){const root=$('sessions');root.replaceChildren();const query=$('search').value.toLowerCase(),projects=new Map();for(const session of sessions){if(!(session.title+' '+session.cwd).toLowerCase().includes(query))continue;const key=session.cwd||t('临时任务','Temporary tasks');if(!projects.has(key))projects.set(key,[]);projects.get(key).push(session);}for(const [cwd,items] of projects){const card=document.createElement('div');card.className='card';const title=document.createElement('h2');title.className='sub';title.textContent=cwd;card.append(title);for(const session of items){const button=document.createElement('button');button.className='session';const name=document.createElement('strong');name.textContent=(session.busy?'● ':'')+(session.title||t('未命名会话','Untitled session'));const info=document.createElement('small');info.textContent=session.harness+' · '+session.model;button.append(name,info);button.onclick=()=>openSession(session.id);card.append(button);}root.append(card);}if(!projects.size){root.textContent=t('尚无会话，可在电脑上创建项目任务。','No sessions yet. Create a project task on your computer.');}}
function openSession(id){sessionId=id;current=null;$('listView').hidden=true;$('chatView').hidden=false;$('back').hidden=false;$('draft').value=drafts[id]||'';notice(t('正在打开会话…','Opening session…'));$('messages').replaceChildren();refresh();}
function back(){drafts[sessionId]=$('draft').value;sessionId='';current=null;$('listView').hidden=false;$('chatView').hidden=true;$('back').hidden=true;refresh();}
function renderChat(value){current=value;$('chatTitle').textContent=value.title||t('会话','Session');$('chatInfo').textContent=value.cwd+' · '+value.harness+' · '+value.model;$('send').disabled=!!value.busy;$('stop').disabled=!value.busy;const root=$('messages'),nearBottom=window.innerHeight+window.scrollY>=document.body.scrollHeight-180;root.replaceChildren();for(const item of value.messages||[]){const block=document.createElement('div');block.className='message '+item.role;const label=document.createElement('label');label.textContent=item.role==='user'?t('你','You'):t('智能体','Agent');const content=document.createElement('span');content.textContent=item.text;block.append(label,content);root.append(block);}const activity=$('activity');activity.hidden=!(value.activity?.length);activity.textContent=(value.activity||[]).map(a=>(a.status==='completed'?'✓ ':a.status==='failed'?'! ':'↻ ')+a.text).join('\n');const plan=$('plan');plan.replaceChildren();plan.hidden=!(value.tasks?.length);if(value.tasks?.length){const title=document.createElement('strong');title.textContent=t('任务计划','Task plan');const list=document.createElement('ol');for(const task of value.tasks){const li=document.createElement('li');li.textContent=({completed:'✓',in_progress:'↻',cancelled:'−',pending:'○'}[task.status]||'○')+' '+task.text;if(task.status==='completed')li.className='done';list.append(li);}plan.append(title,list);}const approvals=$('approvals');approvals.replaceChildren();for(const approval of value.approvals||[]){const card=document.createElement('div');card.className='card';const title=document.createElement('p');title.textContent=approval.title;const row=document.createElement('div');row.className='row';for(const [decision,zh,en] of [['deny','拒绝','Deny'],['allow','允许','Allow']]){const button=document.createElement('button');button.textContent=t(zh,en);button.onclick=()=>act('approve',{requestId:approval.requestId,decision});row.append(button);}card.append(title,row);approvals.append(card);}renderQuestion(value.question);if(nearBottom)window.scrollTo(0,document.body.scrollHeight);}
function renderQuestion(prompt){const signature=JSON.stringify({sessionId,prompt});if(signature===lastQuestionSignature)return;lastQuestionSignature=signature;const root=$('questions');root.replaceChildren();if(!prompt)return;const card=document.createElement('div');card.className='card question';const values={};for(const q of prompt.questions){const title=document.createElement('p');title.textContent=q.prompt;card.append(title);values[q.id]=[];for(const option of q.options){const label=document.createElement('label'),input=document.createElement('input');input.type=q.multiSelect?'checkbox':'radio';input.name=q.id;input.onchange=()=>{values[q.id]=q.multiSelect?[...card.querySelectorAll('input[name="'+CSS.escape(q.id)+'"]:checked')].map(i=>i.value):[option.id];};input.value=option.id;label.append(input,document.createTextNode(' '+option.label));card.append(label);}}const button=document.createElement('button');button.textContent=t('提交回答','Submit answers');button.onclick=()=>act('question',{requestId:prompt.requestId,answers:values});card.append(button);root.append(card);}
async function act(action,extra={}){const id=sessionId;try{await api({action,sessionId:id,...extra});if(id===sessionId)refresh();}catch(e){notice(e.message);}}
async function send(){const text=$('draft').value.trim();if(!text||!sessionId)return;const id=sessionId;$('send').disabled=true;try{await api({action:'send',sessionId:id,text});delete drafts[id];if(id===sessionId){$('draft').value='';refresh();}}catch(e){notice(e.message);}finally{if(id===sessionId)$('send').disabled=!!current?.busy;}}
renderLabels();
</script></body></html>
