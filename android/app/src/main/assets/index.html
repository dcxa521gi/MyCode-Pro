<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"><title>MyCode</title><style>
:root{color-scheme:light dark;--bg:#f5f6f7;--panel:#fff;--fg:#20272b;--sub:#6d787e;--line:#dce1e4;--hover:#edf0f2;--accent:#3b7882}@media(prefers-color-scheme:dark){:root{--bg:#14252b;--panel:#1d333b;--fg:#d8e6eb;--sub:#8da6b0;--line:#35505a;--hover:#29434d;--accent:#79bac3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}header strong{font-size:18px;flex:1}header{gap:6px}header button{padding:7px 9px;font-size:12px}#phoneProfileForm{display:grid;gap:8px}#phoneProfileForm label{margin-top:8px;font-size:12px;color:var(--sub)}button{transition:background .16s,transform .16s}button:active{transform:translateY(1px)}button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}button:active{background:var(--hover)}button:disabled{opacity:.4}input,textarea,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;width:100%}textarea{resize:vertical}main{padding:16px;max-width:880px;margin:auto}h2{font-size:18px;margin:0 0 12px}p{line-height:1.6}.sub{color:var(--sub);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.status{font-size:12px;color:var(--sub);padding:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.session{width:100%;text-align:left;border:0;background:transparent;padding:12px 0;border-bottom:1px solid var(--line)}.session:last-child{border:0}.session strong{display:block}.session small{display:block;margin-top:5px;color:var(--sub);word-break:break-all}.message{padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.message.user{background:var(--hover);border-radius:14px;padding:14px;margin:14px 0}.message label{display:block;color:var(--sub);font-size:11px;margin-bottom:6px}#composer{position:sticky;bottom:0;padding:12px;background:var(--bg);border-top:1px solid var(--line);margin:0 -16px -16px}#composer textarea{min-height:70px;max-height:200px}#composer .row{margin-top:8px}#activity{font-size:12px;line-height:1.6;color:var(--sub);white-space:pre-wrap}#plan li{padding:7px 0;list-style:none}#plan ol{padding:0;margin:0}.done{color:var(--sub);text-decoration:line-through}#chatTitle{overflow-wrap:anywhere}.question label{display:block;padding:6px 0}.question input{width:auto}#language{width:auto;font-size:12px;padding:7px}#notice{position:sticky;top:68px;background:var(--bg);z-index:1}footer{padding:20px 0;color:var(--sub);font-size:11px;text-align:center}[hidden]{display:none!important}
</style></head><body><header><button id="back" hidden onclick="back()">‹</button><strong>MyCode</strong><button onclick="usePhone()" data-zh="手机" data-en="Phone"></button><button onclick="desktopMode()" data-zh="电脑" data-en="Desktop"></button><select id="language" aria-label="Language" onchange="setUiLanguage(this.value)"><option value="zh-CN">中文</option><option value="en">English</option></select><button id="disconnect" hidden onclick="disconnect()">断开</button></header><main><div id="notice" role="status" class="status"></div><section id="pairView"><div class="card"><h2 data-zh="在手机上开始工作" data-en="Start on your phone"></h2><p class="sub" data-zh="配置手机自己的模型服务商，独立聊天。连接电脑后可同步查看和继续电脑上的项目会话。" data-en="Configure phone model providers for standalone chats. Connect a desktop to view and continue its project conversations."></p><button onclick="usePhone()" data-zh="独立使用" data-en="Use independently"></button></div><div class="card"><h2 data-zh="连接电脑上的 MyCode" data-en="Connect to desktop MyCode"></h2><p class="sub" data-zh="在电脑打开 设置 → 手机连接，开启连接并扫码。在电脑选择直连或远程中继，远程模式可跨网络使用，任务在电脑执行。" data-en="Enable Settings → Mobile connection on your computer. Choose direct or remote connection on the desktop. Remote mode works across networks; tasks run on the computer."></p><div class="row"><button onclick="Desktop.scan()" data-zh="扫描配对二维码" data-en="Scan pairing QR"></button><button onclick="Desktop.paste()" data-zh="粘贴配对信息" data-en="Paste pairing code"></button></div><textarea id="pairText" rows="4" style="margin:12px 0" aria-label="Pairing information" placeholder="配对信息 / Pairing information"></textarea><select id="pairAddress" aria-label="电脑直连地址 / Direct desktop address" hidden style="margin-bottom:12px"></select><button id="pairButton" onclick="pair()" data-zh="配对连接" data-en="Pair and connect"></button><p class="sub" data-zh="配对码仅可使用一次，10 分钟内有效。直连校验证书，远程模式端到端加密。模型密钥留在电脑，设备授权加密保存在手机中。" data-en="Pairing is single-use and expires in 10 minutes. Direct mode pins the certificate; remote mode uses end-to-end encryption. Model keys remain on the computer; device authorization is encrypted on this phone."></p></div></section><section id="listView" hidden><div class="row" style="align-items:center;margin-bottom:16px"><h2 style="flex:1;margin:0" data-zh="项目与会话" data-en="Projects and sessions"></h2><button onclick="refresh()" data-zh="刷新" data-en="Refresh"></button></div><input id="search" aria-label="Search sessions" placeholder="搜索会话 / Search sessions" oninput="renderSessions()"><div id="sessions" style="margin-top:12px"></div></section><section id="chatView" hidden><h2 id="chatTitle"></h2><div id="chatInfo" class="sub"></div><details id="modelPanel" class="card"><summary data-zh="代理与模型" data-en="Agent and model"></summary><input id="modelSearch" style="margin-top:12px" aria-label="Search models" placeholder="搜索模型 / Search models" oninput="renderModels()"><select id="modelSelect" aria-label="Model" style="margin-top:8px" onchange="modelSelection=this.value"></select><button id="applyModel" style="margin-top:8px" onclick="changeModel()" data-zh="应用模型" data-en="Apply model"></button><p id="modelHint" class="sub"></p></details><div id="plan" class="card" hidden></div><div id="activity" class="card" hidden></div><div id="approvals"></div><div id="questions"></div><button id="older" hidden onclick="older()" data-zh="加载更早消息" data-en="Load earlier messages"></button><div id="phoneModelRow" class="card" hidden><label data-zh="模型服务商" data-en="Model provider"></label><select id="phoneModel"></select></div><div id="messages"></div><div id="composer"><textarea id="draft" aria-label="Message" placeholder="输入下一步想法 / Next instruction"></textarea><div class="row"><button id="stop" onclick="act('stop')" data-zh="暂停任务" data-en="Pause task"></button><button id="send" onclick="send()" data-zh="发送" data-en="Send"></button></div><p id="composerHint" class="sub" data-zh="沿用当前会话的项目、代理和模型；电脑上的权限规则仍然生效。" data-en="Uses this session's project, agent and model. Desktop permission rules still apply."></p></div></section><section id="phoneView" hidden><div class="row" style="margin-bottom:16px"><h2 data-zh="手机会话" data-en="Phone chats"></h2><button onclick="newPhoneChat()" data-zh="新建会话" data-en="New chat"></button><button onclick="phoneSettings()" data-zh="模型服务商" data-en="Model providers"></button></div><div id="phoneChats" class="card"></div></section>
<section id="phoneSettings" hidden><div class="card"><h2 data-zh="模型服务商" data-en="Model providers"></h2><div id="phoneProfiles"></div><form id="phoneProfileForm" onsubmit="event.preventDefault();saveProfile()"><label data-zh="名称" data-en="Name"></label><input id="profile-name" required><label data-zh="API 基础地址" data-en="API base URL"></label><input id="profile-url" type="url" placeholder="https://api.example.com/v1" required><label data-zh="API 协议" data-en="API protocol"></label><select id="profile-protocol"><option value="openai-completions">OpenAI Chat Completions</option><option value="anthropic-messages">Anthropic Messages</option></select><label data-zh="模型 ID" data-en="Model ID"></label><input id="profile-model" required><label data-zh="API 密钥" data-en="API key"></label><input id="profile-key" type="password" autocomplete="off" required><p class="sub" data-zh="手机独立调用需要自己的 API 密钥，保存在设备加密存储中。" data-en="Standalone calls use your own API key, encrypted on this device."></p><button type="submit" data-zh="保存服务商" data-en="Save provider"></button></form></div></section><footer data-zh="MyCode · 随时继续你的工作" data-en="MyCode · Continue your work from anywhere"></footer></main><script>
let language='zh-CN',sessions=[],current=null,sessionId='',timer=null,inFlight=false,pending={},sequence=0,drafts={},lastQuestionSignature='',modelSelection='',modelSignature='',connectionWarning='',messageCache={},fullMessages={},historyTotal=0;const $=id=>document.getElementById(id),t=(zh,en)=>language==='zh-CN'?zh:en;
function renderLabels(){document.documentElement.lang=language;document.querySelectorAll('[data-zh]').forEach(el=>el.textContent=el.dataset[language==='zh-CN'?'zh':'en']);$('disconnect').textContent=t('断开','Disconnect');}
function notice(text){$('notice').textContent=text;}
function api(input,pair=false){return new Promise((resolve,reject)=>{const id=String(++sequence),timeout=setTimeout(()=>{delete pending[id];reject(Error(t('电脑连接超时，请检查网络及桌面状态。','Desktop timed out. Check network and desktop.')))},75000);pending[id]={resolve,reject,timeout};if(pair)Desktop.pair(id,input);else Desktop.request(id,JSON.stringify(input));});}
window.onNative=(id,result)=>{if(id==='notice'){notice(result.error||result.message||'');return;}if(id==='pairing'){$('pairText').value=result.pairing;return;}if(id==='boot'){connected();return;}if(id==='disconnect'){pauseRefresh();sessionId='';sessions=[];current=null;drafts={};$('messages').replaceChildren();$('pairView').hidden=false;$('listView').hidden=true;$('chatView').hidden=true;$('disconnect').hidden=true;$('back').hidden=true;notice(t('已断开手机连接。电脑任务继续运行。','Phone disconnected. Desktop tasks keep running.'));return;}const item=pending[id];if(!item)return;clearTimeout(item.timeout);delete pending[id];result.error?item.reject(Error(result.error)):item.resolve(result);};
async function pair(){$('pairButton').disabled=true;try{const result=await api($('pairText').value,true);$('pairText').value='';connectionWarning=result.warning||'';connected();}catch(e){notice(e.message);}finally{$('pairButton').disabled=false;}}
function connected(){$('pairView').hidden=true;$('listView').hidden=false;$('disconnect').hidden=false;notice(t('已连接，正在读取电脑会话…','Connected. Loading desktop sessions…'));refresh();}
function disconnect(){Desktop.disconnect();}
function pauseRefresh(){clearTimeout(timer);timer=null;}
async function refresh(){pauseRefresh();if($('pairView').hidden===false||inFlight)return;inFlight=true;try{if(sessionId){const id=sessionId;const result=await api({action:'session',sessionId:id});if(id===sessionId)renderChat(result);}else{const result=await api({action:'snapshot'});sessions=result.sessions||[];renderSessions();}notice(connectionWarning);}catch(e){notice(e.message);}finally{inFlight=false;if(!document.hidden)timer=setTimeout(refresh,sessionId&&current?.busy?2000:5000);}}
function renderSessions(){const root=$('sessions');root.replaceChildren();const query=$('search').value.toLowerCase(),projects=new Map();for(const session of sessions){if(!(session.title+' '+session.cwd).toLowerCase().includes(query))continue;const key=session.cwd||t('临时任务','Temporary tasks');if(!projects.has(key))projects.set(key,[]);projects.get(key).push(session);}for(const [cwd,items] of projects){const card=document.createElement('div');card.className='card';const title=document.createElement('h2');title.className='sub';title.textContent=cwd;card.append(title);for(const session of items){const button=document.createElement('button');button.className='session';const name=document.createElement('strong');name.textContent=(session.busy?'● ':'')+(session.title||t('未命名会话','Untitled session'));const info=document.createElement('small');info.textContent=session.harness+' · '+session.model;button.append(name,info);button.onclick=()=>openSession(session.id);card.append(button);}root.append(card);}if(!projects.size){root.textContent=t('尚无会话，可在电脑上创建项目任务。','No sessions yet. Create a project task on your computer.');}}
function openSession(id){if(sessionId)drafts[sessionId]=$('draft').value;sessionId=id;current=null;messageCache={};fullMessages={};historyTotal=0;modelSelection='';modelSignature='';lastQuestionSignature='';$('questions').replaceChildren();$('approvals').replaceChildren();$('plan').hidden=true;$('activity').hidden=true;$('modelPanel').hidden=true;$('older').hidden=true;$('send').disabled=true;$('stop').disabled=true;$('listView').hidden=true;$('chatView').hidden=false;$('back').hidden=false;$('draft').value=drafts[id]||'';notice(t('正在打开会话…','Opening session…'));$('messages').replaceChildren();refresh();}
function back(){drafts[sessionId]=$('draft').value;sessionId='';current=null;$('listView').hidden=false;$('chatView').hidden=true;$('back').hidden=true;refresh();}
function renderModels(){
 const root=$('modelSelect'),query=$('modelSearch').value.toLowerCase(),catalog=current?.models||[];
 const selected=modelSelection||JSON.stringify([current?.harness,current?.model]);root.replaceChildren();
 const currentOption=document.createElement('option');currentOption.value=selected;const found=catalog.find(m=>JSON.stringify([m.harness,m.id])===selected);currentOption.textContent=found?found.harness+' · '+found.name:t('当前模型不可用，请重新选择','Current model unavailable; select another');currentOption.disabled=!found;root.append(currentOption);
 for(const model of catalog){const key=JSON.stringify([model.harness,model.id]);if(key===selected||!(model.name+' '+model.id+' '+model.harness).toLowerCase().includes(query))continue;const option=document.createElement('option');option.value=key;option.textContent=model.harness+' · '+model.name;root.append(option);}
 root.value=selected;root.disabled=!!current?.busy;$('applyModel').disabled=!!current?.busy||!catalog.length;$('modelHint').textContent=t('使用电脑已配置的可用模型，密钥保留在电脑。','Uses models configured on the computer. Keys remain on the computer.');
}
async function changeModel(){try{const [harness,model]=JSON.parse($('modelSelect').value);if(!current?.models?.some(m=>m.id===model&&m.harness===harness))throw Error(t('请重新选择可用模型。','Select an available model.'));$('applyModel').disabled=true;await api({action:'model',sessionId,harness,model});modelSelection='';modelSignature='';await refresh();}catch(e){notice(e.message);}finally{$('applyModel').disabled=!!current?.busy||!$('modelSelect').value;}}
function mergeMessages(value){if(value.history&&value.history.total<historyTotal){messageCache={};fullMessages={};}if(value.history)historyTotal=value.history.total;const messages=value.messages||[];if(messages.length){const first=messages[0].index??0;for(const [id,m]of Object.entries(messageCache))if((m.index??0)>=first)delete messageCache[id];}for(const [i,m]of messages.entries()){const id=m.id||'message-'+i;const full=fullMessages[id];if(full&&(full.prefix!==m.text||full.length!==m.textLength))delete fullMessages[id];messageCache[id]=m;}}
function renderMessages(){const root=$('messages');root.replaceChildren();for(const item of Object.values(messageCache).sort((a,b)=>(a.index??0)-(b.index??0))){const block=document.createElement('div');block.className='message '+item.role;const label=document.createElement('label');label.textContent=item.role==='user'?t('你','You'):t('智能体','Agent');const content=document.createElement('span');const full=fullMessages[item.id];content.textContent=full?.text||item.text;block.append(label,content);if(item.truncated&&!full){const button=document.createElement('button');button.textContent=t('查看完整消息','View full message');button.onclick=async()=>{button.disabled=true;try{const id=sessionId;const result=await api({action:'message',sessionId:id,blockId:item.id});if(id!==sessionId)return;fullMessages[item.id]={text:result.text,prefix:item.text,length:item.textLength};content.textContent=result.text;button.hidden=!result.truncated;if(result.truncated)button.textContent=t('已达到单条消息展示上限','Message display limit reached');}catch(e){notice(e.message);}finally{button.disabled=false;}};block.append(button);}root.append(block);}}
async function older(){if(!current?.history?.hasMore)return;$('older').disabled=true;const id=sessionId;const before=Math.min(...Object.values(messageCache).map(m=>m.index??0));try{const value=await api({action:'session',sessionId:id,before});if(id!==sessionId)return;for(const m of value.messages||[])messageCache[m.id]=m;current.history={...current.history,before:value.history.before,hasMore:value.history.hasMore};renderMessages();$('older').hidden=!value.history.hasMore;}catch(e){notice(e.message);}finally{$('older').disabled=false;}}
function renderChat(value){
 const oldest=Object.values(messageCache).length?Math.min(...Object.values(messageCache).map(m=>m.index??0)):null;
 current=value;if(oldest!==null&&value.history){current.history.before=Math.min(oldest,value.history.before);current.history.hasMore=current.history.before>0;}
 $('chatTitle').textContent=value.title||t('会话','Session');$('chatInfo').textContent=value.cwd+' · '+value.harness+' · '+value.model;$('send').disabled=!!value.busy;$('stop').disabled=!value.busy;
 $('modelPanel').hidden=false;const signature=JSON.stringify({models:value.models,model:value.model,harness:value.harness,busy:value.busy});if(modelSignature!==signature){modelSignature=signature;renderModels();}
 const nearBottom=window.innerHeight+window.scrollY>=document.body.scrollHeight-180;mergeMessages(value);renderMessages();$('older').hidden=!current.history?.hasMore;
 const activity=$('activity');activity.replaceChildren();activity.hidden=!(value.activity?.length);for(const item of value.activity||[]){const detail=document.createElement('details'),title=document.createElement('summary'),body=document.createElement('pre');title.textContent=(item.status==='completed'?'✓ ':item.status==='failed'?'! ':'↻ ')+item.text;body.textContent=item.detail||item.text;body.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';detail.append(title,body);activity.append(detail);}
 const plan=$('plan');plan.replaceChildren();plan.hidden=!(value.tasks?.length);if(value.tasks?.length){const title=document.createElement('strong');title.textContent=t('任务计划','Task plan');const list=document.createElement('ol');for(const task of value.tasks){const li=document.createElement('li');li.textContent=({completed:'✓',in_progress:'↻',cancelled:'−',pending:'○'}[task.status]||'○')+' '+task.text;if(task.status==='completed')li.className='done';list.append(li);}plan.append(title,list);}
 const approvals=$('approvals');approvals.replaceChildren();for(const approval of value.approvals||[]){const card=document.createElement('div');card.className='card';const title=document.createElement('p');title.textContent=approval.title;card.append(title);if(approval.preview){const detail=document.createElement('details'),summary=document.createElement('summary'),content=document.createElement('pre');summary.textContent=t('操作详情','Operation details');content.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere';content.textContent=[approval.preview.title,approval.preview.path,approval.preview.output].filter(Boolean).join('\n');detail.append(summary,content);card.append(detail);}const row=document.createElement('div');row.className='row';for(const [decision,zh,en]of [['deny','拒绝','Deny'],['allow','允许','Allow']]){const button=document.createElement('button');button.textContent=t(zh,en);button.onclick=()=>act('approve',{requestId:approval.requestId,decision});row.append(button);}card.append(row);approvals.append(card);}
 renderQuestion(value.question);if(nearBottom)window.scrollTo(0,document.body.scrollHeight);
}
function renderQuestion(prompt){const signature=JSON.stringify({sessionId,prompt});if(signature===lastQuestionSignature)return;lastQuestionSignature=signature;const root=$('questions');root.replaceChildren();if(!prompt)return;const card=document.createElement('div');card.className='card question';const values={};for(const q of prompt.questions){const title=document.createElement('p');title.textContent=q.prompt;card.append(title);values[q.id]=[];for(const option of q.options){const label=document.createElement('label'),input=document.createElement('input');input.type=q.multiSelect?'checkbox':'radio';input.name=q.id;input.onchange=()=>{values[q.id]=q.multiSelect?[...card.querySelectorAll('input[name="'+CSS.escape(q.id)+'"]:checked')].map(i=>i.value):[option.id];};input.value=option.id;label.append(input,document.createTextNode(' '+option.label));card.append(label);}}const button=document.createElement('button');button.textContent=t('提交回答','Submit answers');button.onclick=()=>act('question',{requestId:prompt.requestId,answers:values});card.append(button);root.append(card);}
async function act(action,extra={}){const id=sessionId;try{await api({action,sessionId:id,...extra});if(id===sessionId)refresh();}catch(e){notice(e.message);}}
async function send(){const text=$('draft').value.trim();if(!text||!sessionId)return;const id=sessionId;$('send').disabled=true;try{await api({action:'send',sessionId:id,text});delete drafts[id];if(id===sessionId){$('draft').value='';refresh();}}catch(e){notice(e.message);}finally{if(id===sessionId)$('send').disabled=!!current?.busy;}}

</script><script src="local-ui.js"></script><script>renderLabels();if(Desktop.language)Desktop.language(language);</script></body></html>
