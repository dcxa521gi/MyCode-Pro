name: Publish MyCode Host downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: MyCode source or existing release version
        required: true
        default: "0.21.0"
      mode:
        description: Build from source without adding runtime archives to desktop Releases
        type: choice
        options: [build, migrate]
        default: build
      source_ref:
        description: Source commit or tag to build (empty uses version tag)
        required: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: inputs.mode != 'migrate'
        with:
          ref: ${{ inputs.source_ref || format('v{0}', inputs.version) }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: inputs.mode != 'migrate'
        with:
          node-version: 24
          cache: npm
      - name: Build versioned runtime archives
        if: inputs.mode != 'migrate'
        env:
          HOST_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('package.json')).version !== process.env.HOST_VERSION) throw Error('Source version mismatch');"
          npm ci
          node host/build.mjs
          node host/package.mjs --all
      - name: Verify and relocate runtime downloads
        uses: actions/github-script@v7
        env:
          HOST_VERSION: ${{ inputs.version }}
          HOST_GIT_TOKEN: ${{ github.token }}
          HOST_MODE: ${{ inputs.mode }}
        with:
          script: |
            const crypto = require('node:crypto');
            const version = process.env.HOST_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid version');
            const repo = context.repo;
            const fs = require('node:fs'), path = require('node:path');
            const {execFileSync} = require('node:child_process');
            const folder = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'mycode-host-'));
            const header = `AUTHORIZATION: basic ${Buffer.from(`x-access-token:${process.env.HOST_GIT_TOKEN}`).toString('base64')}`;
            core.setSecret(header);
            const env = {...process.env, GIT_CONFIG_COUNT: '1', GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0: header};
            const git = args => execFileSync('git', args, {cwd: folder, env, encoding: 'utf8'}).trim();
            git(['init']);
            git(['config', 'user.name', 'MyCode release maintenance']);
            git(['config', 'user.email', 'github-actions[bot]@users.noreply.github.com']);
            git(['remote', 'add', 'origin', `https://github.com/${repo.owner}/${repo.repo}.git`]);
            const release = process.env.HOST_MODE === 'migrate'
              ? (await github.rest.repos.getReleaseByTag({...repo, tag: `v${version}`})).data
              : null;
            const tree = [], files = [];
            async function blob(name, bytes) {
              const expected = crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
              fs.writeFileSync(path.join(folder, name), bytes);
              tree.push({path: name, mode: '100644', type: 'blob', sha: expected});
            }
            for (const target of ['darwin-arm64', 'darwin-x64', 'linux-arm64', 'linux-x64', 'win32-arm64', 'win32-x64']) {
              const extension = target.startsWith('win32') ? 'zip' : 'tar.gz';
              const oldName = `monocode-host-${target}.${extension}`;
              const name = `MyCode-host-${target}.${extension}`;
              let bytes, recorded, expectedSize;
              if (release) {
                const asset = release.assets.find(a => a.name === oldName || a.name === name);
                const checksum = release.assets.find(a => a.name === `${asset?.name}.sha256`);
                if (!asset || !checksum) throw Error(`Missing runtime/checksum: ${target}`);
                const response = await fetch(asset.browser_download_url);
                if (!response.ok) throw Error(`Download failed: ${name}`);
                bytes = Buffer.from(await response.arrayBuffer());
                const check = await fetch(checksum.browser_download_url);
                if (!check.ok) throw Error(`Checksum download failed: ${name}`);
                recorded = await check.text(); expectedSize = asset.size;
              } else {
                const archive = path.join(process.env.GITHUB_WORKSPACE, 'build', 'host-packages', name);
                bytes = fs.readFileSync(archive);
                recorded = fs.readFileSync(`${archive}.sha256`, 'utf8');
                expectedSize = fs.statSync(archive).size;
              }
              const hash = crypto.createHash('sha256').update(bytes).digest('hex');
              if (hash !== recorded.trim().split(/\s+/)[0] || bytes.length !== expectedSize) throw Error(`Archive mismatch: ${name}`);
              await blob(name, bytes);
              await blob(`${name}.sha256`, Buffer.from(`${hash}  ${name}\n`));
              files.push({name, sha256: hash, bytes: bytes.length});
              core.info(`Verified and stored ${name}`);
            }
            await blob('manifest.json', Buffer.from(JSON.stringify({product: 'MyCode Host', version, files}, null, 2) + '\n'));
            await blob('README.md', Buffer.from(`# MyCode Host ${version}\n\nVersioned remote runtime downloads, separate from desktop Releases.\n`));
            const branch = `heads/mycode-host-v${version}`;
            let existing;
            try { existing = (await github.rest.git.getRef({...repo, ref: branch})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (existing) {
              const current = (await github.rest.git.getCommit({...repo, commit_sha: existing.object.sha})).data;
              const oldTree = (await github.rest.git.getTree({...repo, tree_sha: current.tree.sha})).data.tree;
              for (const item of oldTree) {
                const replacement = tree.find(row => row.path === item.path);
                if (!replacement || replacement.sha !== item.sha) throw Error(`Existing version content differs: ${item.path}`);
              }
              if (oldTree.length !== tree.length) throw Error('Existing version has a different file set');
            }
            if (existing) git(['fetch', 'origin', `refs/${branch}`]);
            git(['add', '--', ...tree.map(item => item.path)]);
            const treeSha = git(['write-tree']);
            const parents = existing ? ['-p', existing.object.sha] : [];
            const commitSha = git(['commit-tree', treeSha, ...parents, '-m', `Publish verified MyCode Host ${version} downloads`]);
            git(['push', 'origin', `${commitSha}:refs/${branch}`]);
            core.info(`Published MyCode Host download branch: ${commitSha}`);
