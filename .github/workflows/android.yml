name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed Android package and test connection flows
        env:
          MYCODE_ANDROID_KEYSTORE_B64: ${{ secrets.MYCODE_ANDROID_KEYSTORE_B64 }}
          MYCODE_ANDROID_STORE_PASSWORD: ${{ secrets.MYCODE_ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$MYCODE_ANDROID_KEYSTORE_B64"
          test -n "$MYCODE_ANDROID_STORE_PASSWORD"
          export MYCODE_ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/mycode-release.p12"
          printf '%s' "$MYCODE_ANDROID_KEYSTORE_B64" | base64 --decode > "$MYCODE_ANDROID_KEYSTORE_FILE"
          chmod 600 "$MYCODE_ANDROID_KEYSTORE_FILE"
          gradle -p android assembleRelease testDebugUnitTest lintRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyCode-Android-0.18.0
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
