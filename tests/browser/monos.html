<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MyCode resident agent UI verification</title>
  </head>
  <body>
    <div id="root" style="height: 100vh"></div>
    <script>
      const callbacks = new Map();
      let nextCallback = 1;
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main" },
        },
        invoke: async (command, args) =>
          command === "mono_load"
            ? {
                id: args.mono,
                dir: "/fixture/mono",
                soul: "# Fixture soul\n\nPreserve project context.",
                soulHash: "soul-fixture",
                memory: "- Remember fixture context",
                memoryHash: "memory-fixture",
                memoryPath: "/fixture/mono/MEMORY.md",
                topics: [],
              }
            : command === "mono_read"
              ? {
                  text: args.path === "habits.json" ? "[]" : "",
                  hash: "fixture",
                }
              : command === "artifacts_get"
                ? {
                    id: "doc",
                    kind: "document",
                    title: "发布检查",
                    body: "# 发布检查\n\n- 项目与模型配置已保留\n- 常驻智能体工作正常\n\n[README](/demo/README.md)",
                    createdAt: 0,
                    updatedAt: 0,
                    sourceCwd: "/demo",
                  }
                : command === "local_ai_config"
                  ? {
                      connections: [],
                      memory: "",
                      projectMemories: {},
                      mcpServers: null,
                    }
                  : command.includes("listen")
                    ? 0
                    : command.includes("provider_binary")
                      ? {}
                      : null,
        transformCallback: (callback) => {
          const id = nextCallback++;
          callbacks.set(id, callback);
          return id;
        },
        unregisterCallback: (id) => callbacks.delete(id),
        convertFileSrc: (path) => path,
      };
    </script>
    <script type="module" src="./monos.tsx"></script>
  </body>
</html>
