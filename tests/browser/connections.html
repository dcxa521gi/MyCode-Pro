<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MyCode resident agent UI verification</title>
  </head>
  <body>
    <div id="root" style="height: 100vh"></div>
    <script>
      const callbacks = new Map();
      let nextCallback = 1;
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { label: "main" },
        },
        invoke: async (command) =>
          command === "local_ai_config"
            ? {
                connections: [
                  {
                    id: "td-demo",
                    name: "TokenDance • Partner",
                    baseUrl: "https://tokendance.space/gateway/v1",
                    api: "openai-completions",
                    models: ["cogevol-base", "deepseek-v3.2"],
                    enabled: true,
                    hasKey: true,
                  },
                  {
                    id: "mimo-demo",
                    name: "小米 MiMo",
                    baseUrl: "https://api.xiaomimimo.com/v1",
                    api: "openai-completions",
                    models: ["mimo-v2.5"],
                    enabled: true,
                    hasKey: true,
                  },
                ],
                memory: "",
                projectMemories: {},
                mcpServers: null,
              }
            : command === "usage_history"
              ? []
              : command.includes("listen")
                ? 0
                : command.includes("provider_binary")
                  ? {}
                  : null,
        transformCallback: (callback) => {
          const id = nextCallback++;
          callbacks.set(id, callback);
          return id;
        },
        unregisterCallback: (id) => callbacks.delete(id),
        convertFileSrc: (path) => path,
      };
    </script>
    <script type="module" src="./connections.tsx"></script>
  </body>
</html>
